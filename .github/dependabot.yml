version: 2

updates:
  # Keep pinned GitHub Actions up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - "area: ci"
      - "area: deps"
      - "type: chore"
    commit-message:
      prefix: ci
      include: scope

# Why no `gomod` entry for /.dagger
# --------------------------------
# The Dagger Go SDK code under .dagger/internal/dagger and
# .dagger/dagger.gen.go is generated by `dagger develop` and gitignored.
# Dependabot can't run `dagger develop` before evaluating imports, so it
# fails every update with:
#
#   package dagger/particular-set/internal/dagger is not in std
#
# Transitive Go deps in .dagger/go.sum are owned by the Dagger SDK and
# refresh when the engine version in dagger.json bumps and someone runs
# `dagger develop` locally. Any directly-added dep (e.g. yaml.v3) can be
# bumped manually with `go get -u <module> && dagger develop`.
