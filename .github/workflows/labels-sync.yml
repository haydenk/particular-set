name: labels-sync

# Reconciles the labels on the repo with .github/labels.yml. Only runs
# when that file changes on master. Labels not in the manifest are NOT
# deleted (skip-delete: true) so the default GitHub labels stay.

on:
  push:
    branches: [master]
    paths:
      - .github/labels.yml
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

# Explicit permissions block: every scope not listed defaults to `none`.
# `contents: read` is required for actions/checkout to read the repo;
# `issues: write` is the scope GitHub uses for label CRUD.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d  # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: false
