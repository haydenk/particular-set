name: codeql

# Static analysis via CodeQL. Two languages are scanned:
#   - go      → the Dagger module under .dagger/
#   - actions → the workflow files themselves under .github/workflows/
#
# Markdown skill specs are not in scope (no code). Findings are uploaded
# to the repo's Security → Code scanning tab.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Monday rerun catches new queries that ship with CodeQL even
    # if no code has changed in the repo.
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Default token is read-only at the repo level; individual jobs elevate.
permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go does not support build-mode: none in CodeQL — must
          # actually build. The Dagger module lives in .dagger/, so we
          # set up Go from its go.mod and build it explicitly.
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The Dagger module's generated SDK (.dagger/internal/dagger,
      # .dagger/dagger.gen.go) is gitignored — `dagger develop`
      # regenerates it. Required before `go build` will succeed.
      - name: Regenerate Dagger SDK
        if: matrix.language == 'go'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
        with:
          version: "0.21.9"
          verb: develop
          workdir: .dagger

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .dagger/go.mod
          cache-dependency-path: .dagger/go.sum

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Dagger module
        if: matrix.language == 'go'
        working-directory: .dagger
        run: go build ./...

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
