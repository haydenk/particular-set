name: Bug report
description: Something is wrong with a skill spec, the tooling, or the plugin manifest.
title: "bug: "
labels:
  - bug
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please give us enough
        detail to reproduce. For security issues, use the private
        advisory flow instead (see SECURITY.md).

  - type: input
    id: commit
    attributes:
      label: Commit or tag
      description: Which revision did you reproduce against?
      placeholder: e.g. master @ abc1234
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands or skill content that triggers the bug.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      multiple: true
      options:
        - A specific skill (skills/*)
        - Docs (docs/, README, AGENTS.md)
        - Dagger module (.dagger/)
        - CI / GitHub Actions
        - Plugin manifest (.claude-plugin/)
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `dagger version`, OS, mise version, whatever's relevant.
      render: shell
